name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: accountant
          POSTGRES_USER: accountant
          POSTGRES_PASSWORD: accountant_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accountant -d accountant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://accountant:accountant_ci_password@localhost:5432/accountant_test
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run all tests
        run: pytest -q

  docker-build:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build --target runtime --tag accountant-backend:${{ github.sha }} .

  deploy:
    name: Deploy to Azure
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: accountant-backend-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://gelirgider.me
    env:
      SSH_HOST: ${{ secrets.AZURE_HOST }}
      SSH_USER: ${{ secrets.AZURE_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.AZURE_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/accountant
          chmod 600 ~/.ssh/accountant
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested backend commit
        run: |
          ssh -i ~/.ssh/accountant "$SSH_USER@$SSH_HOST" <<'DEPLOY'
            set -euo pipefail
            exec 9>/tmp/accountant-deploy.lock
            flock -w 900 9

            cd ~/accountant/accountant-backend
            test -z "$(git status --porcelain)"
            git fetch origin main

            if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
              echo "A newer backend commit exists; its workflow will deploy it."
              exit 0
            fi

            git merge --ff-only "${{ github.sha }}"
            docker compose -f docker-compose.prod.yml build backend
            docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120 backend
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -c 'import json, urllib.request; body=json.load(urllib.request.urlopen("http://localhost:3001/api/v1/health")); assert body["status"] is True and body["data"]["status"] == "ok"'
          DEPLOY
