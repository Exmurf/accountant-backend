name: accountant-backend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accountant-backend
    restart: unless-stopped
    # The image ships the production command; development trades it for the
    # reloading one, which the bind mount below is what makes useful.
    command:
      [
        'sh',
        '-c',
        'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 3001 --reload',
      ]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-accountant}:${POSTGRES_PASSWORD:-accountant_dev_password}@postgres:5432/${POSTGRES_DB:-accountant}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - '3001:3001'
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:3001/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: accountant-redis
    restart: unless-stopped
    # Nothing here is the source of truth, so persistence is off on purpose: a
    # lost cache costs one query, while an fsync on every write costs latency.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    container_name: accountant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accountant}
      POSTGRES_USER: ${POSTGRES_USER:-accountant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accountant_dev_password}
    ports:
      - '5432:5432'
    volumes:
      - accountant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  accountant_postgres_data:
    name: accountant_backend_postgres_data
